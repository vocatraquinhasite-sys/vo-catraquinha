<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login administrativo — Vô Catraquinha</title>
  <meta name="robots" content="noindex, nofollow" />
  <script>
    (function () {
      try {
        var salvo = localStorage.getItem('vo-catraquinha:tema');
        if (!salvo) salvo = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.setAttribute('data-tema', salvo);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/componentes.css" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body class="corpo-login">
  <div class="caixa-login">
    <button type="button" class="botao-tema" data-acao="alternar-tema" aria-pressed="false" aria-label="Ativar tema escuro" style="align-self:flex-end;">🌙</button>

    <div class="caixa-login__marca">🐾 Vô <span>Catraquinha</span></div>
    <p class="caixa-login__subtitulo">Área administrativa</p>

    <div id="mensagem-login" hidden></div>

    <form id="form-login" class="formulario">
      <div class="campo-form">
        <label for="l-email">E-mail</label>
        <input type="email" id="l-email" name="email" autocomplete="username" required />
      </div>
      <div class="campo-form">
        <label for="l-senha">Senha</label>
        <input type="password" id="l-senha" name="senha" autocomplete="current-password" required />
      </div>
      <button type="submit" class="botao botao--primario botao--bloco" id="botao-login">Entrar</button>
    </form>

    <a href="/index.html" class="caixa-login__voltar">← Voltar para o site</a>
  </div>

  <script src="/js/theme.js"></script>
  <script src="/js/api.js"></script>
  <script src="/admin/js/admin-login.js"></script>
</body>
</html>
